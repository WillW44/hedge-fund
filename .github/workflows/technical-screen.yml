name: Technical Short Screen

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 2-6'

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run technical screen
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node technical-screen.js
