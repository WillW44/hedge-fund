name = "caa-screener"
main = "workers/screener.ts"
compatibility_date = "2024-01-01"

[triggers]
crons = [
  "30 6 * * 1-5",   # 7:30 AM UTC (≈ UKT BST) — morning digest
  "0 13 * * 1-5",   # 2:00 PM UTC — afternoon digest
  "0 22 * * 1-5"    # 10:00 PM UTC — nightly technical screen
]

[vars]
APP_URL = "https://caa.pages.dev"

# Secrets (set via: wrangler secret put SECRET_NAME)
# POLYGON_API_KEY
# ANTHROPIC_API_KEY
# RESEND_API_KEY
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# DIGEST_TO_EMAIL
# DIGEST_FROM_EMAIL
